name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is 26.04, which has no Python 3.9. Blacksmith is installed on the ZeroSum-Solutions org only
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.9", "3.12"]  # 3.9 = macOS /usr/bin/python3, which runs memguard and memwatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Shell syntax
        run: for f in *.sh lib/*.sh tests/*.sh; do bash -n "$f" && echo "ok $f"; done
      - name: Python syntax
        run: python -m py_compile *.py org/*.py
      - name: JSON config
        run: for f in *.json; do python -m json.tool "$f" > /dev/null && echo "ok $f"; done
      - name: Portable tests
        run: python tests/test_inbox_sweep_reap.py && python tests/test_desktop_clean.py && python tests/test_memguard.py && python tests/test_sweep.py && python tests/test_git_sweep.py
# The watchdog suites (tests/watchdog-*-tests.sh) need macOS launchctl and BSD stat;
# run them locally before landing: for t in tests/watchdog-*-tests.sh; do bash "$t"; done
